allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

def configureNamespace = { Project project ->
    def androidExtension = project.extensions.findByName("android")
    if (androidExtension == null || !androidExtension.hasProperty("namespace")) {
        return
    }

    if (androidExtension.namespace != null) {
        return
    }

    def manifestFile = androidExtension.sourceSets?.findByName("main")?.manifest?.srcFile
    def manifestNamespace = null

    if (manifestFile != null && manifestFile.exists()) {
        def manifest = new XmlSlurper(false, false).parse(manifestFile)
        manifestNamespace = manifest.@package?.text()
    }

    androidExtension.namespace = manifestNamespace ?: project.group.toString()
}

subprojects { project ->
    project.plugins.withId("com.android.application") {
        configureNamespace(project)
    }
    project.plugins.withId("com.android.library") {
        configureNamespace(project)
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
