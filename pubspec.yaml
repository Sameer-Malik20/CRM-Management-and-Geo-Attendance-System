name: geo_attendance_system
description: Major Project
publish_to: none

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=2.18.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  table_calendar: ^3.0.7
  firebase_database: ^10.5.7
  google_maps_flutter: ^2.6.1
  location: ^6.0.2
  flutter_spinkit: ^5.1.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  android_id: ^0.5.1
  camera: ^0.12.0
  google_mlkit_face_detection: ^0.13.2
  image: ^4.3.0
  image_picker: ^1.1.2
  http: ^0.13.6
  http_parser: ^4.0.2
  path_provider: ^2.1.5
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.33
  win32: ^5.5.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/gif/loading-gif.gif
    - assets/gif/tick.gif
    - assets/gif/close.gif
    - assets/gif/no_entry.gif
    - assets/logo/logo.png
    - assets/models/mobilefacenet.tflite
    - assets/back.jpg
    - assets/logo/logo-white.png
    - assets/logo/profile.jpg
  
  fonts:

    - family: Poppins-Bold
      fonts:
        - asset: assets/fonts/Poppins-Bold.otf

    - family: Poppins-Medium
      fonts:
        - asset: assets/fonts/Poppins-Medium.otf

    - family: Sansation-Bold
      fonts:
        - asset: assets/fonts/Sansation-Bold.ttf

    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-Bold.ttf
        - asset: assets/fonts/Bitter-Regular.ttf


